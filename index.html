<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DoTask — TaskFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Background decoration -->
  <div class="bg-orb bg-orb--1"></div>
  <div class="bg-orb bg-orb--2"></div>
  <div class="bg-orb bg-orb--3"></div>

  <div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar__brand">
        <span class="brand-icon">✦</span>
        <span class="brand-name">DoTask</span>
      </div>

      <nav class="sidebar__nav">
        <a href="#" class="nav-item nav-item--active">
          <span class="nav-item__icon">⊞</span>
          <span>Visão Geral</span>
        </a>
        <a href="#" class="nav-item">
          <span class="nav-item__icon">◎</span>
          <span>Minhas Tarefas</span>
        </a>
        <a href="#" class="nav-item">
          <span class="nav-item__icon">◈</span>
          <span>Projetos</span>
        </a>
        <a href="#" class="nav-item">
          <span class="nav-item__icon">◷</span>
          <span>Calendário</span>
        </a>
        <a href="#" class="nav-item">
          <span class="nav-item__icon">◬</span>
          <span>Relatórios</span>
        </a>
      </nav>

      <div class="sidebar__footer">
        <div class="user-card">
          <div class="user-card__avatar">CC</div>
          <div class="user-card__info">
            <span class="user-card__name">Claude Code</span>
            <span class="user-card__role">Desenvolvedor</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main content -->
    <main class="main">

      <!-- Header -->
      <header class="header">
        <div class="header__left">
          <p class="header__eyebrow">Quinta-feira, 21 de Maio</p>
          <h1 class="header__title">Bom dia, Claude <span class="wave">👋</span></h1>
        </div>
        <div class="header__actions">
          <button class="btn-icon" aria-label="Notificações">
            <span>🔔</span>
            <span class="badge">2</span>
          </button>
          <button class="btn-primary" id="addTaskBtn">+ Nova Tarefa</button>
        </div>
      </header>

      <!-- Stats bar -->
      <section class="stats-bar" aria-label="Resumo">
        <div class="stat-card">
          <span class="stat-card__value" id="statTotal">4</span>
          <span class="stat-card__label">Total</span>
        </div>
        <div class="stat-card">
          <span class="stat-card__value" id="statProg">1</span>
          <span class="stat-card__label">Em progresso</span>
        </div>
        <div class="stat-card">
          <span class="stat-card__value" id="statDone">1</span>
          <span class="stat-card__label">Concluídas hoje</span>
        </div>
        <div class="stat-card stat-card--accent">
          <span class="stat-card__value" id="statPct">50%</span>
          <span class="stat-card__label">Progresso geral</span>
          <div class="stat-card__bar">
            <div class="stat-card__bar-fill" id="statBar" style="width: 50%"></div>
          </div>
        </div>
      </section>

      <!-- Filters -->
      <section class="filters" aria-label="Filtros">
        <span class="filters__label">Filtrar por status:</span>
        <div class="filters__group">
          <button class="filter-btn filter-btn--active" data-filter="all">
            Todas
            <span class="filter-badge filter-badge--all" id="badge-all">4</span>
          </button>
          <button class="filter-btn" data-filter="pending">
            Pendente
            <span class="filter-badge filter-badge--pending" id="badge-pending">1</span>
          </button>
          <button class="filter-btn" data-filter="progress">
            Em Progresso
            <span class="filter-badge filter-badge--progress" id="badge-progress">2</span>
          </button>
          <button class="filter-btn" data-filter="done">
            Concluído
            <span class="filter-badge filter-badge--done" id="badge-done">1</span>
          </button>
        </div>
      </section>

      <!-- Task board -->
      <section class="board" id="board">

        <!-- Column: Pendente -->
        <div class="column" id="col-pending" data-col="pending">
          <div class="column__header">
            <div class="column__title-group">
              <span class="column__dot column__dot--pending"></span>
              <h2 class="column__title">Pendente</h2>
              <span class="column__count column__count--pending" id="colbadge-pending">1</span>
            </div>
          </div>
          <div class="task-list" id="list-pending"></div>
        </div>

        <!-- Column: Em Progresso -->
        <div class="column column--active" id="col-progress" data-col="progress">
          <div class="column__header">
            <div class="column__title-group">
              <span class="column__dot column__dot--progress"></span>
              <h2 class="column__title">Em Progresso</h2>
              <span class="column__count column__count--progress" id="colbadge-progress">2</span>
            </div>
          </div>
          <div class="task-list" id="list-progress"></div>
        </div>

        <!-- Column: Concluído -->
        <div class="column" id="col-done" data-col="done">
          <div class="column__header">
            <div class="column__title-group">
              <span class="column__dot column__dot--done"></span>
              <h2 class="column__title">Concluído</h2>
              <span class="column__count column__count--done" id="colbadge-done">1</span>
            </div>
          </div>
          <div class="task-list" id="list-done"></div>
        </div>

      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
